# =====================================================
# Application
# =====================================================

spring.application.name=coachiq
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s


# =====================================================
# MySQL
# =====================================================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/userservicedb}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# =====================================================
# MongoDB
# =====================================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/coachiq}


# =====================================================
# Keycloak
# =====================================================

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8181}
keycloak.realm=${KEYCLOAK_REALM:fitness-oauth2}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:coachiq-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/token}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/fitness-oauth2}


# =====================================================
# Spring AI / Groq
# =====================================================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.2


# =====================================================
# Mail
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================================================
# Swagger / OpenAPI
# =====================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =====================================================
# Actuator / Monitoring
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

management.info.env.enabled=true
management.metrics.tags.application=coachiq


# =====================================================
# CORS
# =====================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true


# =====================================================
# Logging
# =====================================================

logging.level.root=INFO
logging.level.com.fitness.coachiq=INFO

logging.pattern.level=%5p [traceId=%X{traceId}]


# =====================================================
# Monthly Progress Report
# =====================================================

app.progress.monthly-cron=0 0 0 L * *
app.progress.timezone=Asia/Kolkata


# =====================================================
# Application Information
# =====================================================

info.app.name=CoachIQ
info.app.version=1.0.0
info.app.description=AI-powered fitness coaching modular monolith